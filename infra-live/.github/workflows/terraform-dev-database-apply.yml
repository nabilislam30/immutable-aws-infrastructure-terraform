name: Terraform Dev Database Apply

on:
  pull_request:
    types:
      - closed
    branches:
      - main
    paths:
      - "dev/database/**"
      - ".github/workflows/terraform-dev-database-apply.yml"

permissions:
  contents: read
  actions: read
  id-token: write

env:
  AWS_REGION: eu-west-2
  TERRAFORM_VERSION: 1.14.8
  TF_WORKING_DIR: dev/database

concurrency:
  group: terraform-dev-database
  cancel-in-progress: false

jobs:
  terraform-apply:
    name: Dev Database - Apply Reviewed Plan

    if: github.event.pull_request.merged == true

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}

    steps:
      # -----------------------------------------------------------------------
      # Checkout the exact commit that was reviewed
      # -----------------------------------------------------------------------

      - name: Checkout reviewed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      # -----------------------------------------------------------------------
      # Locate the successful database PR plan run
      # -----------------------------------------------------------------------

      - name: Find reviewed plan workflow run
        id: plan-run
        uses: actions/github-script@v7
        with:
          script: |
            const headSha = context.payload.pull_request.head.sha;

            const response = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: "terraform-dev-database-pr.yml",
              event: "pull_request",
              head_sha: headSha,
              status: "success",
              per_page: 10
            });

            const run = response.data.workflow_runs.find(
              workflowRun => workflowRun.head_sha === headSha
            );

            if (!run) {
              core.setFailed(
                `No successful Terraform Dev Database PR Plan run found for ${headSha}`
              );
              return;
            }

            core.info(`Using reviewed workflow run: ${run.id}`);
            core.setOutput("run-id", run.id.toString());

      # -----------------------------------------------------------------------
      # Download the exact immutable database plan
      # -----------------------------------------------------------------------

      - name: Download reviewed Terraform plan
        uses: actions/download-artifact@v4
        with:
          name: dev-database-plan-${{ github.event.pull_request.head.sha }}
          path: dev/database
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.plan-run.outputs.run-id }}

      - name: Verify reviewed plan exists
        run: |
          test -f tfplan
          test -f plan.txt
          echo "Reviewed database Terraform plan artifact found."

      # -----------------------------------------------------------------------
      # AWS Authentication - GitHub OIDC
      # -----------------------------------------------------------------------

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: arn:aws:iam::442847318797:role/tf-deploy-dev

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      # -----------------------------------------------------------------------
      # Terraform
      # -----------------------------------------------------------------------

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Terraform Init
        run: terraform init -input=false

      # -----------------------------------------------------------------------
      # Apply the reviewed saved plan
      # -----------------------------------------------------------------------

      - name: Terraform Apply Reviewed Plan
        run: |
          terraform apply \
            -input=false \
            -auto-approve \
            tfplan
